server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name words.rfdsx.online;

    ssl_certificate /etc/nginx/runfuda-certs/siss/live/words.rfdsx.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/runfuda-certs/siss/live/words.rfdsx.online/privkey.pem;

    auth_basic "WordLearner";
    auth_basic_user_file /etc/nginx/runfuda-certs/words.htpasswd;

    location / {
        proxy_pass http://words-app:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
